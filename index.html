<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>J플래너</title>
<meta name="theme-color" content="#1b4b7a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="J플래너">
<link rel="manifest" id="manifestLink" href="data:application/manifest+json,{}">
<link rel="apple-touch-icon" id="touchIcon" href="data:,">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --navy:#1b4b7a; --blue:#3f7cb0; --orange:#d9724a; --gold:#e0a94e;
  --bg:#f6f8fa; --card:#ffffff; --line:#e5e9ee; --ink:#1c2733; --sub:#6b7a89;
  --r:14px; --sh:0 2px 12px rgba(27,75,122,.08);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --abh:56px; --stk:104px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;transition:transform .12s ease}
button:active{transform:scale(.95)}
input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}

/* 앱바 */
.appbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:8px;height:calc(var(--abh) + var(--sat));padding:var(--sat) 12px 0;background:rgba(246,248,250,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--navy);font-size:16px;white-space:nowrap}
.logo i{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--navy);color:#fff;font-style:normal;font-size:15px;position:relative}
.logo i::after{content:"";position:absolute;right:-2px;top:-2px;width:8px;height:8px;border-radius:50%;background:var(--orange);border:2px solid var(--bg)}
.iconbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-weight:700;color:var(--navy);flex:none}
.iconbtn.plus{background:var(--navy);color:#fff;border-color:var(--navy);font-size:20px}
.tripbtn{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:4px;height:34px;padding:0 10px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
.tripbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 헤더 */
.hero{position:relative;height:210px;background:linear-gradient(135deg,var(--navy),var(--blue));background-size:cover;background-position:center;color:#fff;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,25,45,.05) 20%,rgba(10,25,45,.72))}
.hero-in{position:absolute;left:18px;right:18px;bottom:16px}
.hero-label{font-size:12px;letter-spacing:.08em;opacity:.9;font-weight:600}
.hero h1{margin:2px 0 4px;font-size:26px;line-height:1.2;font-weight:800;text-wrap:balance}
.hero-sub{font-size:13px;opacity:.92}
.dday{position:absolute;left:18px;top:16px;background:var(--orange);color:#fff;font-weight:800;font-size:13px;border-radius:999px;padding:4px 11px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.cam{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.22);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;font-size:18px}

/* 상단 고정 탭 */
.sticky{position:sticky;top:calc(var(--abh) + var(--sat));z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.pagetabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 14px 6px}
.pagetabs button{height:36px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:700;color:var(--sub)}
.pagetabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.datetabs{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none;scroll-behavior:smooth}
.datetabs::-webkit-scrollbar{display:none}
.dchip{flex:none;min-width:70px;padding:6px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;line-height:1.25}
.dchip .w{font-size:11px;color:var(--sub)}
.dchip .d{font-weight:800;font-size:14px}
.dchip .c{font-size:10.5px;color:var(--blue);max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dchip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.dchip.on .w,.dchip.on .c{color:rgba(255,255,255,.85)}

/* 일정 페이지 */
.page{padding:14px 14px calc(96px + var(--sab))}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 8px}
.sec-h h2{font-size:15px;margin:0;font-weight:800}
.sec-h .lnk{color:var(--blue);font-weight:700;font-size:13px}
.flight{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;margin-bottom:10px}
.fl-top{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub)}
.fl-top b{color:var(--ink);font-weight:700}
.fl-top button{margin-left:auto;color:var(--blue);font-weight:700;font-size:12.5px}
.fl-mid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:6px}
.fl-mid .ap{font-size:26px;font-weight:800;letter-spacing:.02em;color:var(--navy);line-height:1.1}
.fl-mid small{display:block;font-size:12px;color:var(--sub)}
.fl-mid .tm{font-weight:700;font-variant-numeric:tabular-nums}
.fl-mid .r{text-align:right}
.fl-mid .pl{color:var(--orange);font-size:20px;padding:0 10px;display:flex;align-items:center;gap:6px}
.fl-mid .pl::before,.fl-mid .pl::after{content:"";width:18px;border-top:2px dashed var(--line)}
.addline{width:100%;height:42px;border-radius:12px;border:1.5px dashed var(--line);color:var(--blue);font-weight:700;background:transparent;margin-bottom:18px}
.docs{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:18px;overflow:hidden}
.doc{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 14px;border-top:1px solid var(--line)}
.doc:first-child{border-top:0}
.doc .ic{font-size:20px}
.doc .nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .mt{font-size:12px;color:var(--sub)}
.doc>div{min-width:0}
.empty{padding:14px;color:var(--sub);font-size:13px;text-align:center}
.day-sec{scroll-margin-top:calc(var(--abh) + var(--sat) + var(--stk) + 8px);margin-bottom:18px}
.day-h{display:flex;align-items:baseline;gap:8px;margin:0 2px 8px}
.day-h b{font-size:16px;font-weight:800;color:var(--navy)}
.day-h span{font-size:13px;color:var(--sub)}
.item{display:grid;grid-template-columns:44px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:12px;margin-bottom:10px;scroll-margin-top:calc(var(--abh) + var(--sat) + var(--stk) + 16px);transition:box-shadow .3s,border-color .3s}
.item.flash{border-color:var(--orange);box-shadow:0 0 0 4px rgba(217,114,74,.25)}
.item .ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:21px}
.r1{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.r1 .t{font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.r1 .n{font-weight:700;font-size:15.5px}
.r2{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px;font-size:12px}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.b-alarm{background:#fcefd6;color:#9a6a12}
.b-move{background:#e6eef6;color:var(--blue)}
.b-cat{background:var(--bg);color:var(--sub);border:1px solid var(--line)}
.memo{margin-top:6px;color:#3d4b59;font-size:13.5px;white-space:pre-line;word-break:break-word}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.acts button{height:30px;padding:0 10px;border-radius:9px;background:var(--bg);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink)}
.acts .p{background:var(--navy);border-color:var(--navy);color:#fff}
.acts .del{color:#b4432a}
.acts .del.armed{background:#b4432a;border-color:#b4432a;color:#fff}
.noitems{background:var(--card);border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--sub);font-size:13.5px}

/* 하단 바 */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:55;padding:10px 14px calc(10px + var(--sab));background:rgba(246,248,250,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bottombar .in{max-width:492px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:8px}
.btn{height:46px;border-radius:13px;font-weight:800;padding:0 18px}
.btn.pri{background:var(--orange);color:#fff;box-shadow:0 4px 12px rgba(217,114,74,.3)}
.btn.sec{background:var(--card);border:1px solid var(--line);color:var(--navy)}
.btn.navy{background:var(--navy);color:#fff}
.btn.danger{background:#fff;border:1px solid #e9c3b8;color:#b4432a}
.btn.danger.armed{background:#b4432a;color:#fff}

/* 오버뷰 */
.ov{padding:12px 14px calc(16px + var(--sab))}
#map{height:56vh;min-height:300px;border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--sh);overflow:hidden;background:#e8eef3;z-index:1}
.mapmsg{height:100%;display:grid;place-items:center;text-align:center;color:var(--sub);padding:20px;font-size:13.5px}
.ov-panel{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px}
.prog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--sub);font-weight:700}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--orange));border-radius:99px;transition:width .4s}
.ov-box{margin-top:8px;min-height:58px}
.ov-box .n{font-weight:800;font-size:16px}
.ov-box .m{font-size:13px;color:var(--sub);white-space:pre-line}
.ov-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.ov-btns button{height:42px;border-radius:12px;font-weight:800;background:var(--bg);border:1px solid var(--line);color:var(--navy)}
.ov-btns .now{background:var(--navy);color:#fff;border-color:var(--navy)}
.ov-note{font-size:12px;color:var(--sub);margin-top:8px}
.pinw{background:none;border:0}
.pin{display:flex;align-items:center;gap:4px;transform:translate(-14px,-14px);width:max-content}
.pin b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:800;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);flex:none}
.pin.done b{background:var(--sub)}
.pin.cur b{background:var(--orange)}
.pin span{background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:8px;padding:1px 6px;font-size:11.5px;font-weight:700;color:var(--ink);white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.charw{background:none;border:0}
.char{transform:translate(-50%,-90%);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.char svg{display:block;image-rendering:pixelated}
.char.flip svg{transform:scaleX(-1)}
.char .fB{display:none}
.char[data-f="1"] .fA{display:none}
.char[data-f="1"] .fB{display:block}

/* 시트 */
html.locked,html.locked body{overflow:hidden;overscroll-behavior:none}
.backdrop{position:fixed;inset:0;z-index:90;background:rgba(15,28,45,.42);opacity:0;transition:opacity .25s;touch-action:none}
.backdrop.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:91;max-width:520px;margin:0 auto;max-height:calc(100dvh - var(--sat) - 24px);overflow-y:auto;overscroll-behavior:contain;background:var(--card);border-radius:20px 20px 0 0;padding:8px 18px calc(18px + var(--sab));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:0 -6px 30px rgba(0,0,0,.15)}
.sheet.open{transform:translateY(0)}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:0 0 14px;font-size:18px;font-weight:800}
.f{margin-bottom:14px}
.f>label,.f>.lb{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:6px}
.f input[type=text],.f input[type=url],.f input[type=date],.f input[type=time],.f select,.f textarea{width:100%;height:44px;border:1px solid var(--line);border-radius:11px;padding:0 12px;background:var(--bg);outline:none}
.f textarea{height:84px;padding:10px 12px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--blue);background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:34px;padding:0 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:13px;font-weight:600}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.hint{font-size:12px;color:var(--sub);margin-top:5px}
.files{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.file{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
.file span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file button{color:#b4432a;font-weight:700}
.sheet-btns{display:flex;gap:8px;margin-top:6px}
.sheet-btns .btn{flex:1}
.triprow{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line)}
.triprow .sel{flex:1;text-align:left;display:flex;align-items:center;gap:10px;min-width:0}
.triprow .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:#fff;flex:none}
.triprow.on .ck{background:var(--orange);border-color:var(--orange)}
.triprow .tt{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.triprow .mt{font-size:12px;color:var(--sub)}
.triprow .sel>div{min-width:0}
.mini{height:30px;padding:0 10px;border-radius:9px;background:var(--bg);border:1px solid var(--line);font-size:12.5px;font-weight:700}
.mini.armed{background:#b4432a;color:#fff;border-color:#b4432a}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line)}
.setrow .l b{display:block;font-size:14px}
.setrow .l small{color:var(--sub);font-size:12px}
.help-hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:16px;padding:16px;margin-bottom:14px}
.help-hero b{font-size:18px}
.fcards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.fcard{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
.fcard .e{font-size:20px}
.fcard b{display:block;font-size:13.5px;margin-top:2px}
.fcard small{font-size:12px;color:var(--sub)}
.steps{margin:0;padding-left:20px;font-size:13.5px}
.steps li{margin-bottom:6px}

/* 토스트·알람 */
.toast{position:fixed;left:50%;bottom:calc(84px + var(--sab));transform:translate(-50%,20px);z-index:120;background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.warn{background:#b4432a}
.alarmpop{position:fixed;left:12px;right:12px;top:calc(10px + var(--sat));z-index:130;max-width:496px;margin:0 auto;background:var(--card);border:2px solid var(--gold);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:12px 14px;display:flex;gap:12px;align-items:center;transform:translateY(-140%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.alarmpop.show{transform:translateY(0)}
.alarmpop .e{font-size:26px}
.alarmpop b{display:block}
.alarmpop small{color:var(--sub)}
.alarmpop button{margin-left:auto;height:34px;padding:0 12px;border-radius:10px;background:var(--navy);color:#fff;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="appbar">
    <div class="logo"><i>J</i>플래너</div>
    <button class="iconbtn" id="helpBtn" aria-label="사용법">?</button>
    <button class="tripbtn" id="tripBtn"><span id="tripName"></span>▾</button>
    <button class="iconbtn plus" id="newTripBtn" aria-label="새 여행 만들기">+</button>
  </div>

  <header class="hero" id="hero">
    <span class="dday" id="dday"></span>
    <button class="cam" id="camBtn" aria-label="배경 사진 바꾸기">📷</button>
    <div class="hero-in">
      <div class="hero-label" id="heroLabel"></div>
      <h1 id="heroTitle"></h1>
      <div class="hero-sub" id="heroSub"></div>
    </div>
  </header>

  <div class="sticky" id="sticky">
    <div class="pagetabs">
      <button data-page="plan" class="on">일정</button>
      <button data-page="overview">오버뷰</button>
    </div>
    <div class="datetabs" id="dateTabs"></div>
  </div>

  <main class="page" id="planPage"></main>

  <section class="ov" id="ovPage" hidden>
    <div id="map"></div>
    <div class="ov-panel">
      <div class="prog"><span id="ovCount">오늘의 여정 0/0</span><div class="bar"><i id="ovBar" style="width:0"></i></div></div>
      <div class="ov-box" id="ovBox"></div>
      <div class="ov-btns">
        <button id="ovPrev">◀ 이전</button>
        <button id="ovNow" class="now">지금</button>
        <button id="ovNext">다음 ▶</button>
      </div>
      <div class="ov-note" id="ovNote"></div>
    </div>
  </section>

  <div class="bottombar" id="bottomBar">
    <div class="in">
      <button class="btn pri" id="addItemBtn">+ 일정 추가</button>
      <button class="btn sec" id="settingsBtn">⚙ 설정</button>
    </div>
  </div>
</div>

<input type="file" id="coverInput" accept="image/*" hidden>
<input type="file" id="quickDocInput" accept="image/*,application/pdf" multiple hidden>
<input type="file" id="importInput" accept="application/json,.json" hidden>
<div id="sheetRoot"></div>
<div class="toast" id="toast"></div>
<div class="alarmpop" id="alarmPop"><span class="e">⏰</span><div><b id="alarmTitle"></b><small id="alarmSub"></small></div><button id="alarmClose">확인</button></div>

<script>
"use strict";
/* ================= 기본 상수 ================= */
const KEY = "jplanner:v1", FIRED_KEY = "jplanner:fired", ROUTE_KEY = "jplanner:routes";
const CATS = {
  "항공": {e:"✈️", c:"#3f7cb0"}, "숙소": {e:"🏨", c:"#1b4b7a"}, "식당": {e:"🍜", c:"#d9724a"},
  "카페": {e:"☕", c:"#9a6b4f"}, "명소": {e:"📍", c:"#2f8a6b"}, "이동": {e:"🚇", c:"#6b7a89"},
  "쇼핑": {e:"🛍️", c:"#c0568a"}, "기타": {e:"📝", c:"#e0a94e"}
};
const MOVES = ["도보","지하철","버스","트램","기차","택시","항공","자전거"];

  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const pd = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const ds = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

function hav(a, b){
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLa = r(b.lat - a.lat), dLo = r(b.lng - a.lng);
  const h = Math.sin(dLa/2)**2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLo/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function tripDays(t){
  const out = []; if(!t || !t.start) return out;
  const d = pd(t.start); let e = pd(t.end || t.start); if(e < d) e = new Date(d);
  while(d <= e && out.length < 90){ out.push(ds(d)); d.setDate(d.getDate() + 1); }
  return out;
}

  const td = pd(todayStr()), s = pd(t.start), e = pd(t.end || t.start);
  const diff = Math.round((s - td) / 864e5);
  if(diff > 0) return `D-${diff}`;
  if(diff === 0) return "D-DAY";
  if(td <= e) return `여행 ${Math.round((td - s) / 864e5) + 1}일차`;
  return "여행 종료";
}

}

/* ---------- 파일 처리 ---------- */
function readFile(file){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
function resizeImage(dataUrl, max, q){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      try{ res(c.toDataURL("image/jpeg", q)); }catch(e){ res(dataUrl); }
    };
    img.onerror = () => res(dataUrl);
    img.src = dataUrl;
  });
}
async function filesToDocs(files){
  const out = [];
  for(const f of files){
    try{
      let data = await readFile(f);
      if(/^image\//.test(f.type)) data = await resizeImage(data, 1600, 0.82);
      else if(f.size > 4 * 1024 * 1024) toast(`${f.name}: 파일이 커서 저장이 실패할 수 있어요`, true);
      out.push({name: f.name, data});
    }catch(e){ toast(`${f.name}을(를) 읽지 못했어요`, true); }
  }
  return out;
}
function openDoc(d){
  try{
    const [head, b64] = d.data.split(",");
    const mime = (head.match(/data:([^;]+)/) || [])[1] || "application/octet-stream";
    const bin = atob(b64), arr = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], {type: mime}));
    const w = window.open(url, "_blank");
    if(!w) toast("팝업이 막혔어요. 브라우저에서 팝업을 허용해 주세요", true);
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }catch(e){ toast("파일을 열 수 없어요", true); }
}

function deleteItem(id){
  const t = trip(); t.items = t.items.filter(x => x.id !== id); save(); render(); toast("일정을 삭제했어요");

async function geocodeItem(tripId, itemId){
  const t = S.trips.find(x => x.id === tripId), it = t && t.items.find(x => x.id === itemId);
  if(!it) return;
  const q = it.place || it.name;
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`, {headers:{"Accept-Language":"ko,en"}});
    const j = await r.json();
    if(!t.items.includes(it)) return; // 검색 중에 삭제된 일정
    if(j && j[0]){
      it.lat = +j[0].lat; it.lng = +j[0].lon; save();
      if(page === "overview") renderOverview(); else renderPlan();
      toast(`“${it.name}” 위치를 찾았어요`);
    } else toast(`“${it.name}” 위치를 못 찾았어요. 검색어를 바꿔 보세요`, true);
  }catch(e){ toast("인터넷 연결이 없어 위치를 찾지 못했어요", true); }
}

/* ---------- 다운로드 / ICS ---------- */
function download(name, content, type){
  try{
    const url = URL.createObjectURL(new Blob([content], {type}));
    const a = document.createElement("a"); a.href = url; a.download = name.replace(/[\\/:*?"<>|]/g, "_");
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }catch(e){ toast("파일을 저장할 수 없어요", true); }
}
const icsEsc = s => String(s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
const icsDT = d => `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}T${String(d.getHours()).padStart(2,"0")}${String(d.getMinutes()).padStart(2,"0")}00`;
function buildIcs(items, t){
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//J Planner//KO","CALSCALE:GREGORIAN"];
  items.forEach(it => {
    const [h, m] = it.time.split(":").map(Number);
    const s = pd(it.day); s.setHours(h, m, 0, 0);
    const e = new Date(s.getTime() + 60 * 60000);
    L.push("BEGIN:VEVENT", `UID:${it.id}@jplanner`, `DTSTAMP:${stamp}`, `DTSTART:${icsDT(s)}`, `DTEND:${icsDT(e)}`,
      `SUMMARY:${icsEsc((CATS[it.cat] || CATS["기타"]).e + " " + it.name)}`,
      `DESCRIPTION:${icsEsc([it.memo, it.move ? "이동: " + it.move : "", t ? t.title : ""].filter(Boolean).join("\n"))}`,
      `LOCATION:${icsEsc(it.place || "")}`);
    if(it.mapUrl) L.push(`URL:${it.mapUrl}`);
    if(it.alarm){
      const [ah, am] = it.alarm.split(":").map(Number);
      const a = pd(it.day); a.setHours(ah, am, 0, 0);
      let diff = Math.round((s - a) / 60000);
      if(diff < 0) diff += 1440; // 알람이 일정보다 늦게 적혔으면 전날로 해석
      L.push("BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${icsEsc(it.name)}`, `TRIGGER:-PT${diff}M`, "END:VALARM");
    }
    L.push("END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}

/* ================= 오버뷰 (Leaflet) ================= */
let leafletP = null, map = null, gPins = null, gRoute = null, charMarker = null, animId = 0, ovPts = [], ovSegs = [], ovToken = 0, curSprite = "";
function loadLeaflet(){
  if(window.L) return Promise.resolve();
  if(leafletP) return leafletP;
  leafletP = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    s.onload = () => window.L ? res() : rej(); s.onerror = () => { leafletP = null; rej(); };
    document.head.appendChild(s);
  });
  return leafletP;
}
const routeCache = ls.get(ROUTE_KEY, {});
async function getRoute(a, b, move){
  const straight = [[a.lat, a.lng], [b.lat, b.lng]];
  const dist = hav(a, b);
  if(move === "항공" || dist < 40 || dist > 200000) return straight;
  const k = [a.lat, a.lng, b.lat, b.lng].map(v => (+v).toFixed(5)).join(",");
  if(routeCache[k]) return routeCache[k];
  try{
    const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`);
    const j = await r.json();
    let c = j.routes[0].geometry.coordinates.map(([x, y]) => [y, x]);
    if(c.length > 400){ const st = Math.ceil(c.length / 400); c = c.filter((_, i) => i % st === 0 || i === c.length - 1); }
    c = c.map(([y, x]) => [+y.toFixed(5), +x.toFixed(5)]);
    routeCache[k] = c;
    const keys = Object.keys(routeCache); if(keys.length > 80) delete routeCache[keys[0]];
    ls.set(ROUTE_KEY, routeCache);
    return c;
  }catch(e){ return straight; }
}

/* 픽셀아트 스프라이트 */
const PAL = {K:"#1c2733", S:"#f2c7a5", O:"#d9724a", B:"#3f7cb0", N:"#1b4b7a", W:"#ffffff", Y:"#e0a94e", G:"#8a97a4", H:"#5a3a2a"};
const SPR = {
  walkA:["....HHH.....","...HHHHH....","...SKSKS....","...SSSSS....","....SSS.....","...OOOOO....","..SOOOOOS...","..S.OOO.S...","....NNN.....","...NN.NN....","...N...N....","..KK...KK..."],
  walkB:["....HHH.....","...HHHHH....","...SKSKS....","...SSSSS....","....SSS.....","...OOOOO....","...SOOOS....","...SOOOS....","....NNN.....","....NNN.....","....N.N.....","....KKK....."],
  car:["..............","....OOOOO.....","...OWWOWWO....","..OOOOOOOOOO..",".OOOOOOOOOOOO.",".OYOOOOOOOOYO.",".OOOOOOOOOOOO.","..KKK....KKK..","..KGK....KGK..","...K......K..."],
  train:[".NNNNNNNNNNNN.","NWWNWWNWWNWWWN","NWWNWWNWWNWWWN","NNNNNNNNNNNNNN","NOOOOOOOOOOOON","NNNNNNNNNNNNYN","NNNNNNNNNNNNNN",".KK.KK..KK.KK.","GGGGGGGGGGGGGG"],
  tram:["......K.......",".....K........","....KKK.......",".YYYYYYYYYYYY.","YWWYWWYWWYWWWY","YWWYWWYWWYWWWY","YYYYYYYYYYYYYY","YOOOOOOOOOOOOY","YYYYYYYYYYYYYY",".KK........KK.","GGGGGGGGGGGGGG"],
  plane:["......B.......","......BB......","BB....BBB.....","BBBBBBBBBBBBB.","WBBBBBBBBBBBBB","BB....BBB.....","......BB......","......B......."]
};
function sprSvg(name, px){
  const g = SPR[name], h = g.length, w = g[0].length; let r = "";
  g.forEach((row, y) => [...row].forEach((ch, x) => { if(PAL[ch]) r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${PAL[ch]}"/>`; }));
  return `<svg width="${w*px}" height="${h*px}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges">${r}</svg>`;
}
function spriteKind(move){
  if(["택시","버스"].includes(move)) return "car";
  if(["기차","지하철"].includes(move)) return "train";
  if(move === "트램") return "tram";
  if(move === "항공") return "plane";
  return "walk";
}
function charIcon(kind){
  const a = kind === "walk" ? sprSvg("walkA", 3) : sprSvg(kind, 3);
  const b = kind === "walk" ? sprSvg("walkB", 3) : a;
  return L.divIcon({className:"charw", html:`<div class="char" data-f="0"><div class="fA">${a}</div><div class="fB">${b}</div></div>`, iconSize:[0,0]});
}
function setSprite(kind){ if(curSprite !== kind){ curSprite = kind; charMarker.setIcon(charIcon(kind)); } }
function charEl(){ const e = charMarker && charMarker.getElement(); return e && e.querySelector(".char"); }

function nowIndex(pts, day){
  const td = todayStr();
  if(day < td) return pts.length - 1;
  if(day > td) return 0;
  const hm = nowHM(); let idx = 0;
  pts.forEach((p, i) => { if((p.time || "") <= hm) idx = i; });
  return idx;
}
async function renderOverview(){
  const token = ++ovToken, t = trip(), day = selDay;
  const all = dayItems(t, day), pts = all.filter(i => isNum(i.lat) && isNum(i.lng));
  ovPts = pts; ovSegs = [];
  if(ovReset){ ovReset = false; ovIdx = pts.length ? nowIndex(pts, day) : 0; }
  cancelAnimationFrame(animId);
  const missing = all.length - pts.length;
  $("#ovNote").textContent = (missing ? `좌표가 없는 일정 ${missing}개는 지도에 없어요. ` : "") + "핀을 누르면 일정 카드로 이동해요.";
  if(ovIdx >= pts.length) ovIdx = Math.max(0, pts.length - 1);
  updatePanel();
  try{ await loadLeaflet(); }catch(e){
    $("#map").innerHTML = `<div class="mapmsg">지도를 불러오지 못했어요.<br>인터넷 연결을 확인한 뒤 다시 열어 주세요.</div>`; map = null; return;
  }
  if(token !== ovToken) return;
  if(!map){
    $("#map").innerHTML = "";
    map = L.map("map", {zoomControl:false, attributionControl:true});
    // tile.openstreetmap.org는 Referer 없는 요청(파일로 열기, 카톡·드라이브)을 "Access blocked" 이미지로 막고,
    // CARTO는 API 키를 요구한다. 키 없이 쓸 수 있는 Esri를 기본으로, 실패가 이어지면 osm.de로 바꾼다.
    const TILES = [
      ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {maxZoom:19, attribution:"Tiles © Esri"}],
      ["https://tile.openstreetmap.de/{z}/{x}/{y}.png", {maxZoom:18, attribution:"© OpenStreetMap contributors"}]
    ];
    let ti = 0, tErr = 0, tLayer = null;
    const useTile = i => {
      if(tLayer) map.removeLayer(tLayer);
      tErr = 0;
      tLayer = L.tileLayer(TILES[i][0], TILES[i][1]).addTo(map);
      tLayer.on("tileerror", () => { if(++tErr >= 4 && ti < TILES.length - 1) useTile(++ti); });
      tLayer.bringToBack();
    };
    useTile(0);
    gRoute = L.layerGroup().addTo(map); gPins = L.layerGroup().addTo(map);
    map.setView([37.5665, 126.978], 11);
  }
  setTimeout(() => map && map.invalidateSize(), 60);
  gPins.clearLayers(); gRoute.clearLayers();
  if(charMarker){ charMarker.remove(); charMarker = null; curSprite = ""; }
  if(!pts.length){ return; }
  drawPins();
  // 공항처럼 멀리 떨어진 일정 때문에 지도가 너무 축소되지 않도록, 일정이 몰린 도시(중앙값 기준 150km 이내)에 맞춘다
  const med = arr => arr.slice().sort((a, b) => a - b)[Math.floor(arr.length / 2)];
  const mid = {lat: med(pts.map(p => p.lat)), lng: med(pts.map(p => p.lng))};
  const near = pts.filter(p => hav(p, mid) < 150000);
  const b = L.latLngBounds((near.length ? near : pts).map(p => [p.lat, p.lng]));
  map.fitBounds(b, {padding:[48, 48], maxZoom:16});
  charMarker = L.marker([pts[ovIdx].lat, pts[ovIdx].lng], {icon: charIcon("walk"), interactive:false, zIndexOffset:1000}).addTo(map);
  curSprite = "walk";
  ovSegs = pts.slice(0, -1).map((p, i) => [[p.lat, p.lng], [pts[i+1].lat, pts[i+1].lng]]);
  drawRoutes();
  const segs = await Promise.all(pts.slice(0, -1).map((p, i) => getRoute(p, pts[i+1], pts[i+1].move)));
  if(token !== ovToken) return;
  ovSegs = segs; drawRoutes();
}
function drawPins(){
  gPins.clearLayers();
  ovPts.forEach((p, i) => {
    const cls = i < ovIdx ? "done" : i === ovIdx ? "cur" : "";
    const m = L.marker([p.lat, p.lng], {icon: L.divIcon({className:"pinw", html:`<div class="pin ${cls}"><b>${i+1}</b><span>${esc(p.time || "")} ${esc(p.name)}</span></div>`, iconSize:[0,0]})});
    m.on("click", () => focusItem(p.id));
    gPins.addLayer(m);
  });
}
function drawRoutes(){
  if(!gRoute) return;
  gRoute.clearLayers();
  ovSegs.forEach((c, i) => {
    const done = i < ovIdx;
    L.polyline(c, done ? {color:"#1b4b7a", weight:5, opacity:.9} : {color:"#8a97a4", weight:4, opacity:.8, dashArray:"6 8"}).addTo(gRoute);
  });
}
function updatePanel(){
  const n = ovPts.length;
  $("#ovCount").textContent = `오늘의 여정 ${n ? ovIdx + 1 : 0}/${n}`;
  $("#ovBar").style.width = n ? `${(ovIdx + 1) / n * 100}%` : "0";
  const p = ovPts[ovIdx];
  if(!p){ $("#ovBox").innerHTML = `<div class="n">지도에 표시할 일정이 없어요</div><div class="m">일정에 장소를 넣으면 좌표를 찾아 여기에 보여 드려요.</div>`; }
  else {
    const c = CATS[p.cat] || CATS["기타"];
    $("#ovBox").innerHTML = `<div class="n">${c.e} ${esc(p.time || "")} ${esc(p.name)}</div><div class="m">${p.move ? `${MOVE_E[p.move] || ""} ${esc(p.move)}로 이동 · ` : ""}${esc(p.memo || p.place || "")}</div>`;
  }
  $("#ovPrev").disabled = ovIdx <= 0; $("#ovNext").disabled = ovIdx >= n - 1;
  $("#ovPrev").style.opacity = ovIdx <= 0 ? .45 : 1; $("#ovNext").style.opacity = ovIdx >= n - 1 ? .45 : 1;
}
function animateAlong(coords, move){
  cancelAnimationFrame(animId);
  if(!charMarker || !coords || coords.length < 2) return;
  setSprite(spriteKind(move));
  const pts = coords.map(c => L.latLng(c[0], c[1])), cum = [0];
  for(let i = 1; i < pts.length; i++) cum.push(cum[i-1] + pts[i-1].distanceTo(pts[i]));
  const total = cum[cum.length - 1];
  if(!total){ charMarker.setLatLng(pts[pts.length - 1]); return; }
  const dur = Math.min(4000, Math.max(1600, 1600 + total / 6));
  const t0 = performance.now(); let seg = 0;
  const step = now => {
    const f = Math.min(1, (now - t0) / dur), e = f < .5 ? 2*f*f : 1 - Math.pow(-2*f + 2, 2) / 2, d = e * total;
    while(seg < cum.length - 2 && cum[seg+1] < d) seg++;
    const a = pts[seg], b = pts[seg+1], len = cum[seg+1] - cum[seg], r = len ? (d - cum[seg]) / len : 1;
    const p = L.latLng(a.lat + (b.lat - a.lat) * r, a.lng + (b.lng - a.lng) * r);
    charMarker.setLatLng(p);
    const el = charEl();
    if(el){ el.classList.toggle("flip", b.lng < a.lng); el.dataset.f = f < 1 ? String(Math.floor(now / 170) % 2) : "0"; }
    if(!map.getBounds().pad(-0.12).contains(p)) map.panTo(p, {animate:false});
    if(f < 1) animId = requestAnimationFrame(step);
  };
  animId = requestAnimationFrame(step);
}
function ovMove(dir){
  const n = ovPts.length; if(!n) return;
  const to = ovIdx + dir; if(to < 0 || to >= n) return;
  const segI = dir > 0 ? ovIdx : ovIdx - 1;
  const seg = ovSegs[segI] || [[ovPts[segI].lat, ovPts[segI].lng], [ovPts[segI+1].lat, ovPts[segI+1].lng]];
  const move = ovPts[segI + 1].move;
  ovIdx = to;
  if(map){ drawRoutes(); drawPins(); }
  updatePanel();
  if(map && charMarker) animateAlong(dir > 0 ? seg : seg.slice().reverse(), move);
}
function ovNow(){
  if(!ovPts.length) return;
  cancelAnimationFrame(animId);
  ovIdx = nowIndex(ovPts, selDay);
  updatePanel();
  if(map){
    drawRoutes(); drawPins();
    const p = ovPts[ovIdx];
    if(charMarker){ setSprite("walk"); charMarker.setLatLng([p.lat, p.lng]); }
    map.setView([p.lat, p.lng], Math.max(map.getZoom(), 15));
  }
  toast(selDay === todayStr() ? "지금 시각 기준 위치로 이동했어요" : "오늘이 아닌 날이라 시작 위치를 보여 드려요");
}
function focusItem(id){
  page = "plan"; render();
  const el = document.getElementById("item-" + id);
  if(!el) return;
  spyLock = Date.now() + 900;
  el.scrollIntoView({behavior:"smooth", block:"center"});
  el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1700);
}

/* ================= 알람 ================= */
let audioCtx = null;
function beep(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    [0, .25].forEach(off => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      const st = audioCtx.currentTime + off;
      g.gain.setValueAtTime(.0001, st); g.gain.exponentialRampToValueAtTime(.3, st + .02); g.gain.exponentialRampToValueAtTime(.0001, st + .18);
      o.start(st); o.stop(st + .2);
    });
  }catch(e){}
}
function checkAlarms(){
  const d = todayStr(), hm = nowHM(), [nh, nm] = hm.split(":").map(Number), nowMin = nh * 60 + nm;
  const fired = ls.get(FIRED_KEY, []);
  S.trips.forEach(t => (t.items || []).forEach(it => {
    if(!it.alarm || it.day !== d) return;
    const [ah, am] = it.alarm.split(":").map(Number), aMin = ah * 60 + am;
    const key = `${it.id}|${it.day}|${it.alarm}`;
    if(nowMin >= aMin && nowMin - aMin <= 5 && !fired.includes(key)){
      fired.push(key);
      showAlarm(it);
    }
  }));
  ls.set(FIRED_KEY, fired.slice(-300));
}
function showAlarm(it){
  const c = CATS[it.cat] || CATS["기타"];
  $("#alarmTitle").textContent = `${c.e} ${it.time || ""} ${it.name}`;
  $("#alarmSub").textContent = it.memo ? it.memo.split("\n")[0] : (it.place || "곧 일정이 시작돼요");
  $("#alarmPop").classList.add("show");
  beep();
  try{
    if("Notification" in window && Notification.permission === "granted"){
      const body = `${it.time || ""} ${it.memo ? it.memo.split("\n")[0] : ""}`;
      if(navigator.serviceWorker && navigator.serviceWorker.controller){ navigator.serviceWorker.ready.then(r => r.showNotification(it.name, {body})).catch(() => {}); }
      else new Notification(`⏰ ${it.name}`, {body});
    }
  }catch(e){}
  setTimeout(() => $("#alarmPop").classList.remove("show"), 20000);
}

/* ================= PWA 매니페스트 ================= */
function setupPwa(){
  try{
    // maskable: 갤럭시 런처가 원·둥근 사각형으로 잘라내므로 꽉 찬 배경 + 가운데 80% 안에 글자를 둔다
    const icon = (size, maskable) => {
      const c = document.createElement("canvas"); c.width = c.height = size; const x = c.getContext("2d"), s = size / 192;
      x.fillStyle = "#1b4b7a"; x.beginPath();
      if(!maskable && x.roundRect) x.roundRect(0, 0, size, size, 40*s); else x.rect(0, 0, size, size);
      x.fill();
      const k = maskable ? 0.72 : 1, o = (1 - k) * 96 * s;
      x.fillStyle = "#fff"; x.font = `800 ${120*s*k}px -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif`; x.textAlign = "center"; x.textBaseline = "middle";
      x.fillText("J", o + 92*s*k, o + 104*s*k);
      x.fillStyle = "#d9724a"; x.beginPath(); x.arc(o + 146*s*k, o + 50*s*k, 18*s*k, 0, Math.PI*2); x.fill();
      return c.toDataURL("image/png");
    };
    const i192 = icon(192), i512 = icon(512), m512 = icon(512, true);
    const start = location.href.split("#")[0];
    const manifest = {id: start, name:"J플래너", short_name:"J플래너", lang:"ko", start_url: start, scope: start.replace(/[^/]*$/, ""),
      display:"standalone", orientation:"portrait", background_color:"#f6f8fa", theme_color:"#1b4b7a",
      icons:[{src:i192, sizes:"192x192", type:"image/png", purpose:"any"}, {src:i512, sizes:"512x512", type:"image/png", purpose:"any"}, {src:m512, sizes:"512x512", type:"image/png", purpose:"maskable"}]};
    $("#manifestLink").href = "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(manifest));
    $("#touchIcon").href = i192;
  }catch(e){}
}

/* ================= 이벤트 ================= */
document.addEventListener("click", e => {
  if(audioCtx === null){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(err){ audioCtx = undefined; } }
  if(e.target.closest("[data-close]")){ closeSheet(); return; }
  const pt = e.target.closest(".pagetabs button");
  if(pt){ page = pt.dataset.page; if(page === "overview") ovReset = true; render(); return; }
  const chip = e.target.closest("#dateTabs .dchip");
  if(chip){
    selDay = chip.dataset.day; setChip(selDay);
    if(page === "plan"){
      spyLock = Date.now() + 900;
      const sec = document.getElementById("day-" + selDay);
      const target = sec && (sec.querySelector(".item") || sec);
      if(target) target.scrollIntoView({behavior:"smooth", block:"start"});
    } else { ovReset = true; renderOverview(); }
    return;
  }
  const a = e.target.closest("[data-act]");
  if(!a) return;
  const t = trip(), it = a.dataset.id ? t.items.find(x => x.id === a.dataset.id) : null;
  switch(a.dataset.act){
    case "dir": if(it) window.open(dirUrl(it), "_blank", "noopener"); break;
    case "map": if(it) window.open(searchUrl(it), "_blank", "noopener"); break;
    case "cal": if(it){ if(!it.time) return toast("시간을 넣어야 캘린더에 담을 수 있어요", true); download(`${it.name}.ics`, buildIcs([it], t), "text/calendar"); toast("캘린더 파일을 저장했어요. 열어서 캘린더에 추가하세요"); } break;
    case "doc":
      if(!it) break;
      if((it.userDocs || []).length){
        openSheet(`<h3>첨부파일 · ${esc(it.name)}</h3><div class="docs">${it.userDocs.map((d, i) => `<button class="doc" data-act="openDoc" data-id="${it.id}" data-i="${i}"><span class="ic">${/^data:application\/pdf/.test(d.data) ? "📄" : "🖼️"}</span><div><div class="nm">${esc(d.name)}</div><div class="mt">탭하면 새 창으로 열려요</div></div></button>`).join("")}</div><div class="sheet-btns"><button class="btn sec" data-act="quickDoc" data-id="${it.id}">+ 파일 더 첨부</button><button class="btn sec" data-close>닫기</button></div>`);
      } else { quickDocTarget = it.id; $("#quickDocInput").click(); }
      break;
    case "quickDoc": quickDocTarget = it && it.id; closeSheet(); $("#quickDocInput").click(); break;
    case "openDoc": { const d = it && it.userDocs[+a.dataset.i]; if(d) openDoc(d); break; }
    case "edit": if(it) itemSheet(it.id); break;
    case "del": if(it) twoTap(a, "한 번 더", () => deleteItem(it.id)); break;
    case "addFlight": flightSheet(null); break;
    case "editFlight": flightSheet(a.dataset.id); break;
  }
});
let quickDocTarget = null;
$("#quickDocInput").onchange = async e => {

  }catch(err){ toast("J플래너 백업 파일이 아니에요", true); }
};
$("#ovPrev").onclick = () => ovMove(-1);

$("#alarmClose").onclick = () => $("#alarmPop").classList.remove("show");
document.addEventListener("keydown", e => { if(e.key === "Escape") closeSheet(); });
window.addEventListener("resize", measureSticky);

/* ================= 시작 ================= */
setupPwa();
render();
checkAlarms();
setInterval(checkAlarms, 15000);
setInterval(() => { renderTop(); }, 60000);
